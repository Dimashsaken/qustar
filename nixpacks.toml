# Force Nixpacks to use only the Node provider to prevent accidental Deno detection
providers = ["node"]

# Environment variables
[variables]
PORT = "8080"  # Railway will override this at runtime

# Required environment variables for Supabase (set these in Railway dashboard):
# EXPO_PUBLIC_SUPABASE_URL = "https://odmfmyrdaisfboswcidq.supabase.co"
# EXPO_PUBLIC_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9kbWZteXJkYWlzZmJvc3djaWRxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTEwMDIxNjUsImV4cCI6MjA2NjU3ODE2NX0.KaRqs_2cq6_RojECahFMeo4J2-E2vBlkAiImOj9tikk"

# Installation phase – rely on default Node provider install but ensure clean install
[phases.install]
cmds = ["npm install --legacy-peer-deps"]

# Build phase – generate static web output using Expo export
[phases.build]
cmds = ["EXPO_NO_CACHE=1 NODE_ENV=production npm run build:web"]

# Start phase – serve the static build
[start]
cmd = "npx serve -s dist -l $PORT" 